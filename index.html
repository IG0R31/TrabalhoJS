<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tarefas JS</title>
</head>
<body>
    <h1>Gerenciamento de Tarefas</h1>

    <input type="text" id="inputTarefa" placeholder="Digite a descrição da tarefa">
    <button id="botaoAdicionar">Adicionar</button>

    <div>
        <button id="filtroTodas">Todas</button>
        <button id="filtroAtivas">Ativas</button>
        <button id="filtroConcluidas">Concluídas</button>
    </div>

    <p id="contador"></p>
    <ul id="listaTarefas"></ul>

    <script src="scripts.js"></script>
</body>
</html>
